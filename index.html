<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2f5d34" />
    <title>Village of Roots</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="phone">
      <!-- START SCREEN -->
      <section class="start" id="startScreen">
        <div class="start-inner">
          <div class="start-ico" aria-hidden="true">🌳</div>
          <h1 class="game-title">Village<br />of Roots</h1>
          <p class="tagline">Farm, fish, craft and trade. Build the village together.</p>
          <form class="login" id="loginForm" autocomplete="off">
            <label>
              Username
              <input id="userInput" maxlength="16" placeholder="e.g. Rowan" required />
            </label>
            <label>
              Coop ID
              <input id="coopInput" maxlength="20" placeholder="e.g. sunny-hollow" required />
            </label>
            <button class="big-btn" type="submit" id="playBtn">Play</button>
          </form>
          <button class="link-btn" id="startHelpBtn" type="button">How to Play</button>
        </div>
      </section>

      <!-- GAME SHELL -->
      <main class="game" id="gameScreen" hidden>
        <header class="header">
          <button class="round-btn" id="menuBtn" aria-label="Menu">⚙️</button>
          <h2 class="header-title" id="coopTitle">Village of Roots</h2>
          <button class="pill-btn" id="helpBtn">Help</button>
        </header>

        <div class="banner">
          <div class="banner-text">
            <span class="banner-label">What next?</span>
            <span id="hintText"></span>
            <span class="banner-msg" id="msgText"></span>
          </div>
          <div class="banner-coins"><span id="coins">0</span> 🪙</div>
        </div>

        <div class="stats" id="stats"></div>

        <div class="content" id="content">
          <section class="tab active" id="tab-home"></section>
          <section class="tab" id="tab-pack"></section>
          <section class="tab" id="tab-craft"></section>
          <section class="tab" id="tab-market"></section>
          <section class="tab" id="tab-coop"></section>
        </div>

        <nav class="tabbar" id="tabbar">
          <button class="tab-btn active" data-tab="home">
            <span class="ico">🌱</span><span>Homestead</span>
          </button>
          <button class="tab-btn" data-tab="pack">
            <span class="ico">🎒</span><span>Pack</span>
          </button>
          <button class="tab-btn" data-tab="craft">
            <span class="ico">🍳</span><span>Craft</span>
          </button>
          <button class="tab-btn" data-tab="market">
            <span class="ico">🛒</span><span>Market</span>
          </button>
          <button class="tab-btn" data-tab="coop">
            <span class="ico">🏘️</span><span>Coop</span>
          </button>
        </nav>
      </main>

      <!-- HELP / MENU MODAL -->
      <div class="modal" id="modal" hidden>
        <div class="modal-card">
          <h3 id="modalTitle"></h3>
          <div id="modalBody"></div>
          <button class="big-btn small" id="modalClose">Close</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
